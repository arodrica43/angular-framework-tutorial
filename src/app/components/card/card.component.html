<article class="card">
  <img class="card__image" [src]="image" [alt]="name" />

  <div class="card__content">
    <h2 class="card__name">{{ name }}</h2>
    <p class="card__description">{{ description }}</p>
  </div>

  <button type="button" class="btn btn-light">
     View profile →
  </button>

</article>
